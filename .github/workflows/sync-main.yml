name: Upstream Sync (disabled for Marvy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream_sync_disabled:
    name: Explain product branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Keep product main independent
        run: |
          echo "Automatic upstream synchronization is disabled: main hosts the Marvy application."
          echo "Review upstream changes on a development branch and merge them manually."
